


services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_assistant_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_assistant_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  chroma:
    image: chromadb/chroma:latest
    container_name: smartops_chroma
    restart: always
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"

  backend:
    build:
      context: .
    container_name: smartops_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
       - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-it_assistant_db}
       - CHROMA_HOST=chroma
       - CHROMA_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./data/chroma_db:/app/data/chroma_db
      - ./pipelineRAG:/app/pipelineRAG
      - ./pipelineRAG:/app/pipelineRAG
      - ./ml:/app/ml
    working_dir: /app
    command: sh -c "sleep 5 && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pg_data:
  chroma_data: